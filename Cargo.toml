[package]
name = "flow-wm"
version = "0.1.0"
edition = "2024"
description = "A scrolling, infinite-horizontal-canvas tiling window manager for Windows"
license = "MIT"
repository = "https://github.com/CCpcalvin/flow-wm"
readme = "README.md"
keywords = ["windows", "window-manager", "tiling", "wm", "scrolling"]
categories = ["command-line-utilities", "os"]

[[bin]]
name = "flowd"
path = "src/main.rs"

[[bin]]
name = "flow"
path = "src/bin/flow.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2"
log = "0.4"
env_logger = "0.11.10"
clap = { version = "4.6.1", features = ["derive"] }

# Win32 bindings. Feature flags are transitive gates that enable functions
# in other modules (e.g., Win32_System_IO gates ReadFile/WriteFile/ConnectNamedPipe;
# Win32_Security gates CreateFileW/CreateNamedPipeW).
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Pipes",
  "Win32_System_IO",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Accessibility",
  "Win32_System_Threading",
  "Win32_System_StationsAndDesktops",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_System_LibraryLoader",
  "Win32_UI_Shell",
  "Win32_System_Com",
  "Win32_System_Registry",
] }
regex = "1.12.3"
crossbeam-channel = "0.5.15"
toml = "1.1.2"
chrono = { version = "0.4.45", default-features = false, features = [
  "clock",
  "std",
] }
schemars = "1.2.1"
ureq = { version = "3.3.0", features = ["rustls"] }
sha2 = "0.11.0"
zip = { version = "8.6.0", features = ["deflate-flate2"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[package.metadata.docs.rs]
targets = ["x86_64-pc-windows-msvc"]

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
