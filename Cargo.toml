[package]
name = "scrolling-tiling-manager"
version = "0.1.0"
edition = "2024"
description = "A scrolling, infinite-horizontal-canvas tiling window manager for Windows"

[[bin]]
name = "stmd"
path = "src/main.rs"

[[bin]]
name = "stm"
path = "src/bin/stm.rs"

[[bin]]
name = "stm-watchdog"
path = "src/bin/stm-watchdog.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
schemars = "0.8"
thiserror = "2"
log = "0.4"
env_logger = "0.11.10"
clap = { version = "4.6.1", features = ["derive"] }

# Win32 bindings. Feature flags are transitive gates that enable functions
# in other modules (e.g., Win32_System_IO gates ReadFile/WriteFile/ConnectNamedPipe;
# Win32_Security gates CreateFileW/CreateNamedPipeW).
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_System_Threading", "Win32_System_StationsAndDesktops", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm"] }
regex = "1.12.3"
crossbeam-channel = "0.5.15"
toml = "1.1.2"

[profile.release]
opt-level = 3
lto = true
strip = true

[package.metadata.docs.rs]
targets = ["x86_64-pc-windows-msvc"]

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
