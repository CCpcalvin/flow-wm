[package]
name = "scrolling-tiling-manager"
version = "0.1.0"
edition = "2024"
description = "A scrolling, infinite-horizontal-canvas tiling window manager for Windows"

[[bin]]
name = "stmd"
path = "src/main.rs"

[[bin]]
name = "stm"
path = "src/bin/stm.rs"

[[bin]]
name = "stm-watchdog"
path = "src/bin/stm-watchdog.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "0.8"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
strip = true

[package.metadata.docs.rs]
targets = ["x86_64-pc-windows-msvc"]
