#:schema ./schemas/stm-config.schema.json

# Default application configuration for ScrollingTilingManager.
#
# This file ships alongside stmd.exe and provides the canonical defaults for
# all application settings. Users can override any of these values by editing
# their own stm.toml in the config directory (~/.config/stm/stm.toml).
#
# This file must contain ALL StmConfig fields. If a field is missing,
# deserialization fails with "missing field 'xyz'" — that's intentional,
# it catches forgotten updates when adding new config fields.
#
# Users' stm.toml files can be partial; the TOML-level merge fills gaps
# from this file before deserializing. See src/config/lifecycle.rs.
#
# For field documentation, see the StmConfig docstring in src/config/types.rs.

# The virtual key code treated as the Super/modifier key.
# VK_F24 is F24 — an uncommon key that avoids conflicts with system shortcuts.
super_key = "VK_F24"

# Default column width in pixels.
column_width = 1280

# Minimum column width in pixels. Columns cannot be resized below this.
min_column_width_px = 640

# Padding settings in pixels.
#
# - window: inset around each window within its container cell (visual gap)
# - up: top screen margin so windows don't touch the top edge
# - down: bottom screen margin (e.g., for taskbar clearance)
[padding]
window = 2
up = 2
down = 2

# Hotkey bindings (13 total).
# Uses Vim-style Super+H/J/K/L for focus navigation.
[hotkeys]
focus_left = "Super+H"
focus_right = "Super+L"
focus_up = "Super+K"
focus_down = "Super+J"
swap_left = "Super+Shift+H"
swap_right = "Super+Shift+L"
scroll_left = "Super+Left"
scroll_right = "Super+Right"
toggle_float = "Super+Space"
toggle_monocle = "Super+M"
close_window = "Super+Q"
reload_config = "Super+Shift+R"
place_above = "Super+A"

# Animation settings for layout transitions.
[animation]
enabled = true
duration_ms = 240
easing = "ease-out-expo"

# Strategy for restoring minimized tiling windows.
# Options: original_slot, right_of_focused, append_right
[minimize_restore]
strategy = "original_slot"
